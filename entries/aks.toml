[project]
id = "aks"
name = "AKS Sorting Networks"
description = "O(log n)-depth, O(n log n)-size sorting networks via the AKS construction"
url = "https://github.com/girving/aks"
commit = "f172ac6c2e46cf30b3aae7e4d19704905133b2bc"
branch = "main"

[lean]
toolchain = "leanprover/lean4:v4.29.0-rc4"
mathlib_tag = "master"

[[theorems]]
spec_module = "Registry.AKS.Challenge"
impl_module = "AKS.Seiferas"
names = ["networks_exist"]
permitted_axioms = ["propext", "Quot.sound", "Classical.choice"]

[checks]
# Comparator is the primary check: sandboxed rebuild, kernel-level proof export,
# statement/proof comparison, axiom allowlist. SafeVerify and lean4checker are
# optional extras (see docs/checks.md).
comparator = true
# Replay comparator's export through the independent nanoda kernel as well.
nanoda = false
# Compare spec `def`s via comparator's definition_names (previously SafeVerify's job).
definitions = false
safe_verify = false
lean4checker = false

[build]
strategy = "copy"
targets = "AKS Challenge"

[tools]
safe_verify_rev = "main"
lean4checker_rev = "v4.29.0-rc4"
