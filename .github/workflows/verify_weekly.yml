name: Weekly Full Verification

on:
  schedule:
    # Weekly on Sundays at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  detect-entries:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.detect.outputs.entries }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover registry entries
        id: detect
        run: |
          entries=$(ls entries/*.toml 2>/dev/null | xargs -I{} basename {} .toml | sort | jq -R . | jq -sc .)
          echo "entries=$entries" >> "$GITHUB_OUTPUT"

      - name: Print discovered entries
        run: |
          echo "Entries to verify: ${{ steps.detect.outputs.entries }}"

  verify:
    needs: detect-entries
    if: needs.detect-entries.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.detect-entries.outputs.entries) }}
    name: Full - ${{ matrix.entry }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Tools are installed by verify_entry.sh so that each entry's own
      # tools.*_rev pins reach the installer; see verify.yml for the detail.
      - name: Verify ${{ matrix.entry }} (comparator + nanoda)
        run: |
          ./scripts/verify_entry.sh "entries/${{ matrix.entry }}.toml" --with-nanoda

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.entry }}
          path: results/${{ matrix.entry }}/latest.json

  commit-results:
    needs: verify
    # always(): the weekly run covers every entry, and `needs` alone would skip
    # this job whenever any single entry failed — discarding refreshed results
    # for all the entries that succeeded.
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          path: downloaded-results

      - name: Update results
        run: |
          for dir in downloaded-results/results-*/; do
            entry=$(basename "$dir" | sed 's/^results-//')
            mkdir -p "results/$entry"
            if [[ -f "$dir/latest.json" ]]; then
              cp "$dir/latest.json" "results/$entry/latest.json"
              mkdir -p "results/$entry/history"
              cp "$dir/latest.json" "results/$entry/history/$(date -u +%Y%m%d_%H%M%S).json"
            fi
          done

      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          if git diff --cached --quiet; then
            echo "No changes to results"
          else
            git commit -m "Update weekly verification results"
            git push
          fi
