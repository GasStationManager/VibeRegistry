name: Verify Registry Entries

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'specs/**'
      - 'scripts/**'
  pull_request:
    paths:
      - 'entries/**'
      - 'specs/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      checks:
        description: 'Checks to run (comma-separated, blank = entry defaults)'
        required: false
        default: ''
        type: string
      entry:
        description: 'Specific entry to verify (blank = auto-detect or all)'
        required: false
        default: ''
        type: string

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.detect.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed entries
        id: detect
        run: |
          # For workflow_dispatch with specific entry, use that
          if [[ -n "${{ github.event.inputs.entry }}" ]]; then
            echo 'entries=["${{ github.event.inputs.entry }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For workflow_dispatch without specific entry, verify all
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            entries=$(ls entries/*.toml 2>/dev/null | xargs -I{} basename {} .toml | jq -R . | jq -sc .)
            echo "entries=$entries" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # For push/PR, detect which entries have changed files
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          # If BASE is empty (first push), verify all
          if [[ -z "$BASE" ]] || [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            entries=$(ls entries/*.toml 2>/dev/null | xargs -I{} basename {} .toml | jq -R . | jq -sc .)
            echo "entries=$entries" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # If scripts changed, verify all entries
          if echo "$CHANGED_FILES" | grep -q '^scripts/'; then
            entries=$(ls entries/*.toml 2>/dev/null | xargs -I{} basename {} .toml | jq -R . | jq -sc .)
            echo "entries=$entries" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Otherwise, detect which entries have changed
          ENTRIES=()
          for config in entries/*.toml; do
            entry_id=$(basename "$config" .toml)
            if echo "$CHANGED_FILES" | grep -qE "^(entries/${entry_id}\.toml|specs/${entry_id}/)"; then
              ENTRIES+=("$entry_id")
            fi
          done

          if [[ ${#ENTRIES[@]} -eq 0 ]]; then
            echo 'entries=[]' >> "$GITHUB_OUTPUT"
          else
            entries=$(printf '%s\n' "${ENTRIES[@]}" | sort -u | jq -R . | jq -sc .)
            echo "entries=$entries" >> "$GITHUB_OUTPUT"
          fi

      - name: Print detected entries
        run: |
          echo "Entries to verify: ${{ steps.detect.outputs.entries }}"

  verify:
    needs: detect-changes
    if: needs.detect-changes.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJson(needs.detect-changes.outputs.entries) }}
    name: Verify ${{ matrix.entry }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Which checks this entry runs decides which tools we need to build.
      - name: Resolve checks
        id: checks
        run: |
          ARGS=()
          if [[ -n "${{ github.event.inputs.checks }}" ]]; then
            ARGS+=(--checks "${{ github.event.inputs.checks }}")
          fi
          PLAN=$(python3 scripts/lib/resolve_checks.py "entries/${{ matrix.entry }}.toml" "${ARGS[@]+"${ARGS[@]}"}")
          echo "$PLAN"
          eval "$PLAN"
          {
            echo "comparator=$CHECK_COMPARATOR"
            echo "nanoda=$CHECK_NANODA"
          } >> "$GITHUB_OUTPUT"

      # Comparator sandboxes its builds with landrun, which needs Go.
      - name: Install Go
        if: steps.checks.outputs.comparator == '1'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # Rust for nanoda; only when the entry asks for the second kernel.
      - name: Install Rust
        if: steps.checks.outputs.nanoda == '1'
        uses: dtolnay/rust-toolchain@stable

      # NOTE: tools are installed by verify_entry.sh, not here. Installing them
      # in this job meant passing only the Lean toolchain, so an entry's
      # tools.comparator_rev / lean4export_rev / landrun_rev pins never reached
      # the installer — and exporting *_BIN made verify_entry.sh skip
      # installation entirely, so the pins had no effect at all.
      - name: Verify ${{ matrix.entry }}
        run: |
          ARGS=()
          if [[ -n "${{ github.event.inputs.checks }}" ]]; then
            ARGS+=(--checks "${{ github.event.inputs.checks }}")
          fi
          ./scripts/verify_entry.sh "entries/${{ matrix.entry }}.toml" "${ARGS[@]+"${ARGS[@]}"}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.entry }}
          path: results/${{ matrix.entry }}/latest.json
