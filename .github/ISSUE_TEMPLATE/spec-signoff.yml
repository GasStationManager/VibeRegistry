name: Sign-off
description: Attest that a Lean statement says what the mathematics says — for a registry entry or an overlaid upstream record.
title: "Sign-off: "
labels: ["signoff"]
body:
  - type: markdown
    attributes:
      value: |
        ## Sign-off

        Machine checks establish that an implementation proves a statement. They
        say nothing about whether the statement is the right one. That is what a
        sign-off adds, and it is the only part no tool here can do for you.

        The same form covers both kinds of target:

        - **Registry entry** — our own entry with human-vetted specs under `specs/<id>/`.
        - **Overlay record** — a record mirrored from Palomar or LeanPool. Those
          registries machine-check the proof but leave statement fidelity to a
          language model; your sign-off is the layer they lack.

        Before reviewing, generate the packet — it puts the informal statement,
        the Lean statement, and the checks that ran in one file:

        ```
        python3 scripts/generate_signoff_packet.py entries/<id>.toml       # registry entry
        python3 scripts/generate_signoff_packet.py --overlay leanpool:<id> # overlay record
        ```

  - type: dropdown
    id: target_kind
    attributes:
      label: Target kind
      description: What are you signing off on?
      options:
        - Registry entry
        - "Overlay record: palomar"
        - "Overlay record: leanpool"
    validations:
      required: true

  - type: input
    id: target_id
    attributes:
      label: Target ID
      description: |
        For a registry entry, its id (e.g. `artificial-theorems`, `stat-learning`,
        `aks`, `archon-first-proof`, `lean-zip`).
        For an overlay record, its upstream id — a Palomar ID
        (`PALOMAR-2026-08-13-000001`) or a LeanPool slug (`2-coloring-1-round`).
      placeholder: artificial-theorems
    validations:
      required: true

  - type: textarea
    id: reviewed
    attributes:
      label: What you reviewed
      description: |
        **Registry entry:** spec file paths, one per line, relative to
        `specs/<entry>/` (e.g. `Registry/StatLearning/Dudley.lean`).

        **Overlay record:** declaration names, one per line
        (e.g. `Distributed2Coloring.pStar_ge_23879`), or a single `*` for every
        declaration in the record. A sign-off covers exactly what you list here.
      placeholder: |
        Registry/StatLearning/Dudley.lean
        Registry/StatLearning/EfronStein.lean
    validations:
      required: true

  - type: input
    id: literature_ref
    attributes:
      label: Literature reference
      description: The textbook, paper, or standard reference the statement corresponds to.
      placeholder: "Boucheron et al. (2013) Concentration Inequalities, Theorem 5.6"
    validations:
      required: true

  - type: dropdown
    id: verdict
    attributes:
      label: Verdict
      description: |
        Does the Lean statement faithfully capture the intended mathematics?
        A rejection is recorded too — it is information the next reader needs.
      options:
        - Approved
        - Rejected
    validations:
      required: true

  - type: textarea
    id: comments
    attributes:
      label: Comments
      description: Anything a later reader should know — caveats, scope limits, or why you rejected it.
    validations:
      required: false
